<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Assistant</title>
</head>

<body>
    <h1>Voice Assistant</h1>

    <p id="status">Ready</p>

    <button id="startCall">Start Call</button>
    <button id="hangUp" disabled>Hang Up</button>

    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>

    <script>
        const API_URL = "http://127.0.0.1:8000";

        const status = document.getElementById("status");
        const startButton = document.getElementById("startCall");
        const hangUpButton = document.getElementById("hangUp");

        let room = null;
        let agentParticipant = null;
        let currentRoomName = null;

        function setStatus(text) {
            status.textContent = text;
        }

        startButton.addEventListener("click", async () => {
            try {
                startButton.disabled = true;
                setStatus("Connecting...");

                const response = await fetch(
                    `${API_URL}/api/session/start`,
                    {
                        method: "POST"
                    }
                );

                if (!response.ok) {
                    throw new Error("Failed to start session");
                }

                const { url, token, room_name } = await response.json();

                currentRoomName = room_name;

                // Create a client-side object to connect to the LiveKit room
                room = new LivekitClient.Room();

                // Receive the agent's audio track.
                room.on(
                    LivekitClient.RoomEvent.TrackSubscribed,
                    (track, publication, participant) => {
                        if (
                            track.kind ===
                            LivekitClient.Track.Kind.Audio
                        ) {
                            agentParticipant = participant;

                            const audioElement = track.attach();
                            audioElement.autoplay = true;
                            document.body.appendChild(audioElement);
                        }
                    }
                );

                // Tracks active speakers and updates the status based on whether the agent is speaking.
                room.on(
                    LivekitClient.RoomEvent.ActiveSpeakersChanged,
                    (speakers) => {
                        if (!agentParticipant) {
                            setStatus("Listening");
                            return;
                        }

                        const agentIsSpeaking = speakers.some(
                            (participant) =>
                                participant.identity ===
                                agentParticipant.identity
                        );

                        setStatus(
                            agentIsSpeaking
                                ? "Agent speaking"
                                : "Listening"
                        );
                    }
                );

                // End call if the agent disconnects.
                room.on(
                    LivekitClient.RoomEvent.ParticipantDisconnected,
                    (participant) => {
                        if (
                            agentParticipant &&
                            participant.identity ===
                            agentParticipant.identity
                        ) {
                            agentParticipant = null;
                            setStatus("Agent disconnected");
                        }
                    }
                );

                // End call if the room is disconnected.
                room.on(
                    LivekitClient.RoomEvent.Disconnected,
                    () => {
                        setStatus("Call ended");

                        startButton.disabled = false;
                        hangUpButton.disabled = true;

                        room = null;
                        agentParticipant = null;
                    }
                );

                await room.connect(url, token);

                // Create the microphone with the required
                // audio-processing constraints.
                const micTrack =
                    await LivekitClient.createLocalAudioTrack({
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    });

                await room.localParticipant.publishTrack(
                    micTrack
                );

                setStatus("Listening");
                hangUpButton.disabled = false;

            } catch (error) {
                console.error(error);

                setStatus(
                    `Connection failed: ${error.message}`
                );

                startButton.disabled = false;
                hangUpButton.disabled = true;
            }
        });

        hangUpButton.addEventListener("click", async () => {
            if (room) {
                // Disconnects user from call, the Disconnected event handler will then clean up the UI states.
                await room.disconnect();

                // Clean up server-side session and stop the agent process.
                if (currentRoomName) {
                    await fetch(
                        `${API_URL}/api/session/end/${currentRoomName}`,
                        {
                            method: "POST"
                        }
                    );

                    currentRoomName = null;
                }
            }
        });
    </script>
</body>

</html>
